version: 2.1

jobs:
  unit-tests:
    macos:
      xcode: "27.0.0"
    resource_class: m4pro.medium
    environment:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      NSUnbufferedIO: "YES"
    steps:
      - checkout
      - run:
          name: Install test tools
          command: |
            for tool in swiftlint xcbeautify; do
              if ! command -v "$tool" >/dev/null 2>&1; then
                brew install "$tool"
              fi
            done
      - run:
          name: Resolve Swift packages
          command: |
            xcodebuild -resolvePackageDependencies \
              -project Playpedia.xcodeproj \
              -scheme Playpedia \
              -clonedSourcePackagesDirPath /tmp/playpedia-packages
      - run:
          name: Run XCTest on iPhone simulator
          no_output_timeout: 20m
          command: |
            set -euo pipefail
            mkdir -p test-results artifacts
            SIMULATOR_ID=$(python3 -c '
            import json
            import subprocess
            devices = json.loads(subprocess.check_output(
                ["xcrun", "simctl", "list", "devices", "available", "-j"]
            ))["devices"]
            for runtime, candidates in devices.items():
                if ".iOS-" not in runtime:
                    continue
                for device in candidates:
                    if device.get("isAvailable") and device["name"].startswith("iPhone"):
                        print(device["udid"])
                        raise SystemExit(0)
            raise SystemExit("No available iPhone simulator found")
            ')
            xcrun simctl bootstatus "$SIMULATOR_ID" -b
            xcodebuild test \
              -project Playpedia.xcodeproj \
              -scheme Playpedia \
              -configuration Debug \
              -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
              -parallel-testing-enabled NO \
              -derivedDataPath /tmp/playpedia-derived-data \
              -clonedSourcePackagesDirPath /tmp/playpedia-packages \
              -resultBundlePath artifacts/PlaypediaTests.xcresult \
              CODE_SIGNING_ALLOWED=NO \
              RAWG_API_KEY= \
              2>&1 | tee artifacts/xcodebuild.log | xcbeautify \
                --report junit --report-path test-results
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: artifacts

workflows:
  build-and-test:
    jobs:
      - unit-tests
